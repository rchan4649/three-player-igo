<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3人囲碁対戦 ｜ 三つ巴オンラインバトル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .go-board {
            background-color: #deb887;
            background-image: radial-gradient(circle, #d2b48c 10%, transparent 11%);
            background-size: 20px 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-amber-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

    <!-- ヘッダー -->
    <header class="bg-amber-900/90 backdrop-blur-md border-b border-amber-800 py-4 px-6 sticky top-0 z-50 shadow-sm">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-700 flex items-center justify-center text-xl shadow-inner">
                    🔺
                </div>
                <div>
                    <h1 class="text-base font-black tracking-wider text-white">3人囲碁対戦</h1>
                    <p class="text-[10px] text-amber-300 font-bold tracking-widest uppercase">THREE-PLAYER IGO BATTLE</p>
                </div>
            </div>
            <div id="connectionStatus" class="text-xs font-bold text-rose-300 bg-rose-950/80 px-3 py-1.5 rounded-lg border border-rose-800">
                未接続
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-3xl mx-auto w-full px-4 py-8 flex flex-col items-center space-y-6">
        
        <!-- ルーム接続パネル -->
        <div id="roomPanel" class="bg-amber-900/80 border border-amber-800 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-xl">
            <h2 class="text-sm font-bold text-amber-200 uppercase tracking-widest text-center">3人対局ルームの作成・参加</h2>
            
            <div class="space-y-4">
                <!-- 部屋を作る（ホスト：プレイヤー1 / 黒） -->
                <div class="space-y-2 bg-amber-950/50 p-4 rounded-xl border border-amber-800">
                    <label class="text-[10px] font-bold text-amber-300 uppercase">① 部屋を作る（あなたがプレイヤー1:黒）</label>
                    <div class="flex gap-2">
                        <input type="text" id="customRoomIdInput" placeholder="例: 333" maxlength="10" class="flex-1 bg-amber-950 border border-amber-800 rounded-xl px-4 py-2 text-xs text-white placeholder-amber-500/60 focus:outline-none focus:border-amber-500 font-mono">
                        <button onclick="createRoom()" class="bg-amber-600 hover:bg-amber-500 text-amber-950 font-black text-xs px-4 py-2 rounded-xl shadow transition whitespace-nowrap">
                            部屋を作る
                        </button>
                    </div>
                    <p id="waitMsg" class="text-[10px] text-amber-300 hidden">⏳ プレイヤー2と3の参加を待っています...（IDを教えてね）</p>
                </div>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-amber-800"></div>
                    <span class="flex-shrink mx-4 text-amber-400 text-[10px] font-bold">または 参加する</span>
                    <div class="flex-grow border-t border-amber-800"></div>
                </div>

                <!-- 部屋に参加する -->
                <div class="space-y-3 bg-amber-950/50 p-4 rounded-xl border border-amber-800">
                    <label class="text-[10px] font-bold text-amber-300 uppercase">② 部屋に参加する</label>
                    <input type="text" id="peerIdInput" placeholder="部屋番号..." maxlength="10" class="w-full bg-amber-950 border border-amber-800 rounded-xl px-4 py-2 text-xs text-white placeholder-amber-500/60 focus:outline-none focus:border-amber-500 font-mono">
                    <div class="flex gap-2">
                        <button onclick="joinRoomAsPlayer2()" class="flex-1 bg-slate-200 hover:bg-white text-slate-900 font-bold text-xs py-2.5 rounded-xl shadow transition">
                            参加 (P2:白)
                        </button>
                        <button onclick="joinRoomAsPlayer3()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs py-2.5 rounded-xl shadow transition">
                            参加 (P3:赤)
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 対局ステータス・ターン表示 -->
        <div id="gameUI" class="hidden bg-amber-900/80 border border-amber-800 rounded-2xl p-4 w-full max-w-md flex items-center justify-between shadow-xl">
            <div class="flex items-center gap-3">
                <div id="turnIndicator" class="w-8 h-8 rounded-full bg-slate-950 border-2 border-slate-700 shadow-md flex items-center justify-center text-xs font-bold text-white">黒</div>
                <div>
                    <p class="text-[10px] text-amber-300 font-bold uppercase">あなた: <span id="myRole" class="text-white font-black">--</span></p>
                    <p id="turnText" class="text-sm font-black text-white">黒番のターン</p>
                </div>
            </div>
            <button onclick="sendPass()" class="bg-amber-800 hover:bg-amber-700 text-amber-100 text-xs font-bold px-4 py-2 rounded-xl border border-amber-700 transition">
                パス
            </button>
        </div>

        <!-- 碁盤（9路盤） -->
        <div class="relative p-6 go-board rounded-2xl border-4 border-amber-900 shadow-2xl">
            <div id="board" class="relative w-[320px] h-[320px] sm:w-[380px] sm:h-[380px] grid grid-cols-8 grid-rows-8">
                <!-- 自動生成 -->
            </div>
        </div>

        <!-- X（Twitter）宣伝・シェアボタンエリア -->
        <div class="bg-amber-900/60 border border-amber-800/80 rounded-2xl p-5 w-full max-w-md text-center space-y-3 shadow-lg">
            <p class="text-xs font-bold text-amber-200">友達を誘って三つ巴の戦いを始めよう！</p>
            <a id="twitterShareBtn" href="#" target="_blank" class="inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-950 text-white font-bold text-xs px-6 py-3 rounded-xl shadow transition border border-slate-700 w-full">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                X（Twitter）でシェア・対局者を募集する
            </a>
        </div>

    </main>

    <!-- フッター -->
    <footer class="bg-amber-900/90 border-t border-amber-800 py-6 px-6 text-center text-xs text-amber-400">
        <p>&copy; 2026 3人囲碁対戦 All Rights Reserved.</p>
    </footer>

    <!-- スクリプト -->
    <script>
        const BOARD_SIZE = 9;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        let currentTurn = 0; 
        
        let peer = null;
        let hostPeer = null;
        let connections = [];
        let myPlayerId = null;
        let isHost = false;

        const ID_PREFIX = "uketama-3igo-";
        const boardEl = document.getElementById('board');
        const turnIndicator = document.getElementById('turnIndicator');
        const turnText = document.getElementById('turnText');
        const connectionStatus = document.getElementById('connectionStatus');
        const roomPanel = document.getElementById('roomPanel');
        const gameUI = document.getElementById('gameUI');
        const myRoleEl = document.getElementById('myRole');

        const playerNames = ["プレイヤー1 (黒)", "プレイヤー2 (白)", "プレイヤー3 (赤)"];

        // Xシェアリンクの初期設定
        function updateTwitterShareLink(roomId = "") {
            const text = encodeURIComponent("3人で遊ぶカオスな三つ巴の陣取りゲーム「3人囲碁対戦」を作ったよ！一緒に遊ぼう！\n" + (roomId ? `【部屋番号: ${roomId}】\n` : ""));
            const url = encodeURIComponent(window.location.href);
            document.getElementById('twitterShareBtn').href = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
        }
        updateTwitterShareLink();

        function initBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const intersection = document.createElement('div');
                    intersection.className = "relative w-full h-full flex items-center justify-center cursor-pointer group";
                    
                    const lineH = document.createElement('div');
                    lineH.className = "absolute inset-y-1/2 left-0 right-0 h-[1px] bg-amber-950/60 pointer-events-none";
                    const lineV = document.createElement('div');
                    lineV.className = "absolute inset-x-1/2 top-0 bottom-0 w-[1px] bg-amber-950/60 pointer-events-none";
                    
                    intersection.appendChild(lineH);
                    intersection.appendChild(lineV);

                    if ((r === 2 || r === 4 || r === 6) && (c === 2 || c === 4 || c === 6)) {
                        const star = document.createElement('div');
                        star.className = "absolute w-1.5 h-1.5 rounded-full bg-amber-950/80 pointer-events-none z-0";
                        intersection.appendChild(star);
                    }

                    intersection.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(intersection);
                }
            }
            renderBoard();
        }

        function createRoom() {
            const userInput = document.getElementById('customRoomIdInput').value.trim();
            if (!userInput) { alert('部屋番号を入力してください。'); return; }

            const fullId = ID_PREFIX + userInput;
            isHost = true;
            myPlayerId = 0;
            myRoleEl.textContent = playerNames[0];

            updateTwitterShareLink(userInput);

            peer = new Peer(fullId);

            peer.on('open', () => {
                connectionStatus.textContent = `待機中（P1黒・メンバー待ち...）`;
                connectionStatus.className = "text-xs font-bold text-amber-300 bg-amber-950/80 px-3 py-1.5 rounded-lg border border-amber-700";
                document.getElementById('waitMsg').classList.remove('hidden');
                document.getElementById('customRoomIdInput').disabled = true;
            });

            peer.on('connection', (conn) => {
                connections.push(conn);
                
                conn.on('data', (data) => {
                    if (data.type === 'place') {
                        boardState[data.r][data.c] = data.player;
                        currentTurn = (currentTurn + 1) % 3;
                        renderBoard();
                        updateTurnUI();
                        broadcast({ type: 'sync', board: boardState, turn: currentTurn });
                    } else if (data.type === 'pass') {
                        currentTurn = (currentTurn + 1) % 3;
                        updateTurnUI();
                        broadcast({ type: 'syncTurn', turn: currentTurn });
                    }
                });

                if (connections.length >= 2) {
                    connectionStatus.textContent = '3人対局中（接続完了！）';
                    connectionStatus.className = "text-xs font-bold text-emerald-300 bg-emerald-950/80 px-3 py-1.5 rounded-lg border border-emerald-800";
                    roomPanel.classList.add('hidden');
                    gameUI.classList.remove('hidden');
                    broadcast({ type: 'start', board: boardState, turn: currentTurn });
                }
            });
        }

        function joinRoomAsPlayer2() { joinRoom(1); }
        function joinRoomAsPlayer3() { joinRoom(2); }

        function joinRoom(pId) {
            const userInput = document.getElementById('peerIdInput').value.trim();
            if (!userInput) { alert('部屋番号を入力してください。'); return; }

            const hostId = ID_PREFIX + userInput;
            myPlayerId = pId;
            myRoleEl.textContent = playerNames[pId];

            updateTwitterShareLink(userInput);

            peer = new Peer();

            peer.on('open', () => {
                hostPeer = peer.connect(hostId);

                hostPeer.on('open', () => {
                    connectionStatus.textContent = '対局ルームに接続しました！';
                    connectionStatus.className = "text-xs font-bold text-emerald-300 bg-emerald-950/80 px-3 py-1.5 rounded-lg border border-emerald-800";
                    roomPanel.classList.add('hidden');
                    gameUI.classList.remove('hidden');
                });

                hostPeer.on('data', (data) => {
                    if (data.type === 'sync' || data.type === 'start') {
                        boardState = data.board;
                        currentTurn = data.turn;
                        renderBoard();
                        updateTurnUI();
                    } else if (data.type === 'syncTurn') {
                        currentTurn = data.turn;
                        updateTurnUI();
                    }
                });

                hostPeer.on('close', () => {
                    alert('ホストとの接続が切れました。');
                    location.reload();
                });
            });
        }

        function broadcast(data) {
            connections.forEach(conn => {
                if (conn && conn.open) conn.send(data);
            });
        }

        function handleCellClick(r, c) {
            if (currentTurn !== myPlayerId) {
                alert(`今は ${playerNames[currentTurn]} のターンです！`);
                return;
            }
            if (boardState[r][c] !== null) return;

            boardState[r][c] = myPlayerId;
            currentTurn = (currentTurn + 1) % 3;
            renderBoard();
            updateTurnUI();

            if (isHost) {
                broadcast({ type: 'sync', board: boardState, turn: currentTurn });
            } else {
                hostPeer.send({ type: 'place', r: r, c: c, player: myPlayerId });
            }
        }

        function sendPass() {
            if (currentTurn !== myPlayerId) return;
            currentTurn = (currentTurn + 1) % 3;
            updateTurnUI();

            if (isHost) {
                broadcast({ type: 'syncTurn', turn: currentTurn });
            } else {
                hostPeer.send({ type: 'pass' });
            }
        }

        function renderBoard() {
            const cells = boardEl.children;
            let index = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = cells[index];
                    const existingStone = cell.querySelector('.stone');
                    if (existingStone) existingStone.remove();

                    const val = boardState[r][c];
                    if (val !== null) {
                        const stone = document.createElement('div');
                        stone.className = "stone absolute w-7 h-7 sm:w-8 sm:h-8 rounded-full shadow-lg z-10 transition-transform duration-200 scale-95";
                        if (val === 0) {
                            stone.classList.add('bg-gradient-to-br', 'from-slate-700', 'to-slate-950', 'border', 'border-slate-600');
                        } else if (val === 1) {
                            stone.classList.add('bg-gradient-to-br', 'from-white', 'to-slate-200', 'border', 'border-slate-300');
                        } else if (val === 2) {
                            stone.classList.add('bg-gradient-to-br', 'from-rose-500', 'to-rose-800', 'border', 'border-rose-400');
                        }
                        cell.appendChild(stone);
                    }
                    index++;
                }
            }
        }

        function updateTurnUI() {
            turnText.textContent = `${playerNames[currentTurn]} のターン`;
            if (currentTurn === 0) {
                turnIndicator.className = "w-8 h-8 rounded-full bg-slate-950 border-2 border-slate-700 shadow-md flex items-center justify-center text-xs font-bold text-white";
                turnIndicator.textContent = "黒";
            } else if (currentTurn === 1) {
                turnIndicator.className = "w-8 h-8 rounded-full bg-white border-2 border-slate-300 shadow-md flex items-center justify-center text-xs font-bold text-slate-900";
                turnIndicator.textContent = "白";
            } else {
                turnIndicator.className = "w-8 h-8 rounded-full bg-rose-600 border-2 border-rose-400 shadow-md flex items-center justify-center text-xs font-bold text-white";
                turnIndicator.textContent = "赤";
            }
        }

        initBoard();
    </script>
</body>
</html>
